name: Build Flet Linux Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils clang cmake llvm lld ninja-build pkg-config \
            libgtk-3-dev libsecret-1-0 libsecret-1-dev libunwind-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libmpv-dev mpv

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build Flet Linux Executable
        run: |
          flet build linux --yes --verbose --python-version 3.12 --module-name main

      - name: Archive Linux Build
        run: |
          cd build/linux
          tar -czvf ../../FTPChat-Linux.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTPChat-Linux-Release
          path: FTPChat-Linux.tar.gz