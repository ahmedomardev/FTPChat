name: Build Flet Linux .deb Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies & Ruby
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils clang cmake llvm lld ninja-build pkg-config \
            libgtk-3-dev libsecret-1-0 libsecret-1-dev libunwind-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libmpv-dev mpv ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build Flet Linux Executable
        run: |
          flet build linux --yes --verbose --python-version 3.12 --module-name main

      - name: Package into .deb
        run: |
          fpm -s dir -t deb \
            -n ftpchat \
            -v 2.3.0 \
            --prefix /opt/ftpchat \
            -C build/linux .

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTPChat-Debian-Package
          path: ftpchat_2.3.0_amd64.deb